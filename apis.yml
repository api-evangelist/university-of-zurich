    runs the service. The protocol is OAI-PMH 2.0 and the software is DSpace 8.0 — the contract is
    the community's, the deployment is UZH's.
  description: >-
    The Zurich Open Repository and Archive (ZORA) is UZH's institutional repository for the
    peer-reviewed research output of the university. Its OAI-PMH 2.0 interface serves metadata for
    harvesting with no authentication and no signup, disseminating mods, oai_dc, oai_datacite, marc
    and akaber. ZORA migrated from EPrints to DSpace in October 2025 and the legacy /cgi/oai2 and
    /oai/request base URLs are dead; the live base URL is /server/oai/request. A second OAI-PMH
    context for OpenAIRE is served at /server/oai/openaire and the Identify response embeds an
    OpenAIRE CERIF 1.1 Service compatibility declaration. Earliest datestamp is 2008-02-11.
  humanURL: https://www.zora.uzh.ch/
