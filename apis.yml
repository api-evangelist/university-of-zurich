    this institution — the deployment is recorded, the product's contract is not.
  description: >-
    ZORA runs DSpace 8.0 and exposes the standard DSpace REST API (application/hal+json) for
    programmatic discovery of communities, collections and items representing UZH research output.
    Community and collection reads are open — /server/api/core/communities and
    /server/api/core/collections return data with no credentials — while /server/api/core/items
    returns 401 without an authenticated session. The root document advertises around fifty HAL
    link relations including discover, browses, identifiers, entitytypes and contentreport.
