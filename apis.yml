- aid: university-of-zurich:eduid-idp
  name: University of Zurich Identity Provider (SWITCH edu-ID, tenant)
  x-operator: tenant
  x-operator-basis: >-
    The entityID https://aai-idp.uzh.ch/idp/shibboleth is UZH's namespace and the shibmd:Scope is
    uzh.ch, but every SingleSignOnService and SingleLogoutService Location in the SWITCHaai
    federation metadata points at https://uzh.login.eduid.ch/idp/profile/SAML2/... — a UZH-specific
    hostname on SWITCH's hosted edu-ID platform. UZH's users and UZH's attribute policy; SWITCH's
    running IdP. The generic OIDC issuer at login.eduid.ch is shared by every Swiss institution and
    uzh.login.eduid.ch/.well-known/openid-configuration simply returns login.eduid.ch endpoints, so
    no SWITCH contract is saved under this slug.
  description: >-
    UZH's SAML 2.0 identity provider is delivered by SWITCH edu-ID as a hosted, UZH-scoped IdP and
    registered in the SWITCHaai federation with mdui:DisplayName "University of Zurich". The
    federation metadata aggregate is the machine-readable artifact: it carries the UZH IdP entity
    plus more than two hundred uzh.ch service-provider entities covering gitlab.uzh.ch,
    ezproxy.uzh.ch, the olat.uzh.ch learning platform, the exam.uzh.ch assessment estate and
    eduid.uzh.ch. This is UZH's largest genuinely machine-readable identity surface, and it is a
    tenancy rather than an operation.
  humanURL: https://www.zi.uzh.ch/en/support/identity-access/eduid-faq.html
  baseURL: https://uzh.login.eduid.ch/idp/profile/SAML2/Redirect/SSO
  x-liveness: >-
    GET without a SAMLRequest returns 400 by design; a SAML 2.0 HTTP-Redirect SSO endpoint has no
    meaningful bare-GET response. The endpoint is published in the live SWITCHaai federation
    metadata aggregate (200 on 2026-08-30). Do not read the 400 as a dead pointer.
  tags:
