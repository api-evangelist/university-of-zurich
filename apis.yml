apis:
- aid: university-of-zurich:zora-oai
  name: ZORA Repository OAI-PMH
  description: >-
    The Zurich Open Repository and Archive (ZORA) provides open, worldwide access to the peer-reviewed
    research and scholarly output of the University of Zurich. ZORA supports OAI-PMH 2.0 for metadata
    harvesting. As of October 2025 ZORA migrated from EPrints to DSpace; the OAI-PMH base URL is served
    from the DSpace stack and the legacy EPrints endpoint (/cgi/oai2) is no longer active.
