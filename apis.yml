description: >-
  The University of Zurich (UZH) is Switzerland's largest university, founded in 1833, with roughly
  28,000 students across seven faculties. UZH operates no central developer portal, publishes no
  OpenAPI description of its own, and offers no API key or self-service onboarding of any kind. Its
  real programmable footprint is four institution-run endpoints that speak someone else's contract:
  the ZORA repository's OAI-PMH 2.0 interface and DSpace 8 REST API at www.zora.uzh.ch, the
  KlickerUZH audience-response GraphQL API at api.klicker.uzh.ch built and run by the Department of
  Banking and Finance, and a self-hosted GitLab at gitlab.uzh.ch whose v4 REST API answers
  unauthenticated reads of public projects. Federated identity is a tenancy, not an operation: the
  UZH SAML entity aai-idp.uzh.ch is UZH's namespace but its SSO endpoints run on SWITCH's hosted
  edu-ID platform at uzh.login.eduid.ch. The course catalogue, the OLAT learning platform and
  swisscovery library discovery are web and SSO surfaces with no documented public API.
