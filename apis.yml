  description: >-
    KlickerUZH is the university's open-source audience-response and interactive-learning platform,
    developed and hosted by the UZH Department of Banking and Finance. Its backend is a single
    Apollo GraphQL endpoint. The endpoint is live and validating — an unknown field returns a
    GRAPHQL_VALIDATION_FAILED error rather than a transport failure — but schema introspection is
