- aid: university-of-zurich:zora-rest
  name: ZORA DSpace REST API
  x-operator: institution
  x-operator-basis: >-
    Host www.zora.uzh.ch is UZH's; the API root reports dspaceName "ZORA" and dspaceUI
    https://www.zora.uzh.ch. The HAL+JSON contract is DSpace 8.0's, shipped by the DSpace project
